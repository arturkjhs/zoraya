# Pinned third-party sources for the ports (ADR-0109 item 6). One archive per
# line: name, version, SHA-256, file name in the cache build/ports/src/, URL.
# `make fetch-ports` downloads each archive that is missing from the cache and
# refuses one whose SHA-256 differs (INV-0109-4); nothing else downloads.
# Versions and hashes are TASK-02's (tools/posix-surface/versions.env and
# sources.lock), musl added. tcc and pdpmake are pinned by commit there; here
# by the archive GitHub generates for that commit (ports/README.md). lua,
# openssl, zlib, curl and wget (TASK-27 9a) are built on the host by `make apps` for the image (ADR-0310). lua,
# sqlite and hello are the sources of W2, W3 and W4 (ADR-0110 items 1 and 10),
# built inside Zoraya, not on the host.
# A hash `tar:HEX` is the SHA-256 of the gunzipped archive, and a URL `git+REPO@COMMIT`
# is fetched with git and archived (libctest: repo.or.cz generates its snapshots on
# demand with gzip bytes that differ by machine, and puts a bot check in front of
# them); tools/fetch-ports.sh.
#
# python (TASK-27 9c, ADR-0320): the SHA-256 is the one python.org publishes for Python-3.15.2.tar.xz
# (checked against it); the Sigstore bundle python.org also publishes is not verified here (optional).
#
# llvm (TASK-30, proposed ADR-0360): LLVM 20.1.8's whole source, of which ports/Makefile unpacks
# libcxx, libcxxabi, libunwind and libc (libc++'s from_chars includes LLVM libc's shared headers,
# which no smaller archive of the release holds). 20.1.8 is the newest release whose libc++ supports
# the Clang 18 that CI's Ubuntu 24.04 gives zcc (libc++ 21 and later warn "only supports Clang 19 and
# later"); the SHA-256 is the digest GitHub's release lists for the asset (checked against it).
# googletest (TASK-30): v1.18.0's release asset, the same check.
# ncurses (TASK-31 10a, ADR-0333, ADR-0334): 6.6's release tarball; the SHA-256 is the same from ftp.gnu.org and
# invisible-mirror.net (the .sig the GNU mirror carries is not verified here). 10a builds `tic` and `infocmp` from it
# for the host (tools/term-terminfo/terminfo.sh); the port for the target is 10d's.
# less, nvi2, db1, openssh, git (TASK-31 ports-early, ahead of parts 10d, 10g and 10h): less 710 from greenwoodsoftware.com
# (the Less License); nvi2 2.2.2 is the GitHub archive of the tag v2.2.2 (BSD-3-Clause; an auto-generated archive, whose bytes GitHub does not promise to keep: the hash is the first download's); db1 is Berkeley DB 1.85, the
# last release of the BSD code, from Oracle's download site (a single URL, no mirror) (the 4-clause UC licence, advertising clause withdrawn by UC in 1999; nvi's buffer, ADR-0335 item 2); openssh is
# OpenSSH portable 10.6p2 from the OpenBSD mirror (ADR-0340); git 2.56.1 from kernel.org (GPL-2.0-only, a separate
# program like wget, ADR-0339). The SHA-256 of each is the one of the first download (trust on first use, as for
# ncurses above: none of the signatures these projects publish is verified here).
# mbedtls (TASK-31 10h, ADR-0461): 3.6.8, the newest release of the 3.6 LTS line on 2026-11-19; the SHA-256 is the one
# its release lists in mbedtls-3.6.8-sha256sum.txt (checked against it). Dual-licensed Apache-2.0 OR GPL-2.0-or-later: the
# GPL option is used. It is the TLS backend of the second libcurl, which git-remote-http links, and of nothing else.
# vttest (TASK-31 10d, ADR-0332 item 10, ADR-0391 item 10): the terminal test program, release 20251205 (the newest
# on the author's site on 2026-11-15; a MIT-style notice, Thomas E. Dickey), the same bytes from both of his hosts. It
# is built for the host by tools/term-record/build-vttest.sh to record sessions; it is not built for the target and
# is not in any image.
#
