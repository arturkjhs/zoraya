# Pinned third-party sources for the ports (ADR-0109 item 6). One archive per
# line: name, version, SHA-256, file name in the cache build/ports/src/, URL.
# `make fetch-ports` downloads each archive that is missing from the cache and
# refuses one whose SHA-256 differs (INV-0109-4); nothing else downloads.
# Versions and hashes are TASK-02's (tools/posix-surface/versions.env and
# sources.lock), musl added. tcc and pdpmake are pinned by commit there; here
# by the archive GitHub generates for that commit (ports/README.md). lua,
# sqlite and hello are the sources of W2, W3 and W4 (ADR-0110 items 1 and 10),
# built inside Zoraya, not on the host.
# A hash `tar:HEX` is the SHA-256 of the gunzipped archive, and a URL `git+REPO@COMMIT`
# is fetched with git and archived (libctest: repo.or.cz generates its snapshots on
# demand with gzip bytes that differ by machine, and puts a bot check in front of
# them); tools/fetch-ports.sh.
#
