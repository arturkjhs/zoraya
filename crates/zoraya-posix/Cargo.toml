[package]
name = "zoraya-posix"
description = "The Rust half of libposix (ADR-0100): files, descriptors, pipes and memory on native handles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# An rlib for the host's tests and clippy; ports/Makefile builds the static
# library for libc.a with `cargo rustc --crate-type staticlib`.
[lib]
bench = false

[features]
# The counters and the call log of ADR-0110 item 7, reported to the broker
# before each exit and exec. ports/Makefile builds libc.a with it (proposed
# ADR-0211); the host's tests run without it.
stats = ["zoraya-rt/count"]

[dependencies]
zoraya-abi = { path = "../zoraya-abi" }
zoraya-proto-file = { path = "../zoraya-proto-file" }
zoraya-proto-net = { path = "../zoraya-proto-net" }
zoraya-proto-posix = { path = "../zoraya-proto-posix" }
zoraya-proto-tty = { path = "../zoraya-proto-tty" }
zoraya-protocol = { path = "../zoraya-protocol" }
zoraya-resolve = { path = "../zoraya-resolve" }

[target.'cfg(target_os = "none")'.dependencies]
zoraya-rt = { path = "../zoraya-rt", default-features = false }
zoraya-heap = { path = "../zoraya-heap" }

[dev-dependencies]
zoraya-test-alloc = { path = "../zoraya-test-alloc" }
zoraya-fs = { path = "../zoraya-fs" }
zoraya-fs-service = { path = "../zoraya-fs-service" }
zoraya-fs-testkit = { path = "../zoraya-fs-testkit" }

[lints]
workspace = true
