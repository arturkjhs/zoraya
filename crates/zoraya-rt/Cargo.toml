[package]
name = "zoraya-rt"
description = "The runtime of Zoraya programs: the entry point, typed system calls and a panic handler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
test = false
bench = false

[features]
# The entry point, `main` and the panic handler of a native program. The
# Rust half of libposix (zoraya-posix) has its own: crt1's `_start` and C's
# `main` (ADR-0109 item 4).
default = ["entry"]
entry = []

[dependencies]
zoraya-abi = { path = "../zoraya-abi" }

[lints]
workspace = true
