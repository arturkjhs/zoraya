[package]
name = "zoraya-tls"
description = "TLS 1.2/1.3 client for native programs over rustls and ring (ADR-0228), with the system's time, randomness and roots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "tls12"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc", "less-safe-getrandom-custom-or-rdrand"] }
getrandom = { version = "=0.2.17", default-features = false, features = ["custom"] }
zoraya-rng = { path = "../zoraya-rng" }

[lints]
workspace = true

[dev-dependencies]
zoraya-test-alloc = { path = "../zoraya-test-alloc" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "tls12", "std"] }
