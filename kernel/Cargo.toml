[package]
name = "zoraya-kernel"
description = "Zoraya kernel: boot and machine-dependent code for aarch64 QEMU virt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "zoraya-kernel"
test = false
bench = false

[features]
# Build the in-QEMU test kernel instead of the normal one.
qemu-test = []

[dependencies]
zoraya-abi = { path = "../crates/zoraya-abi" }
zoraya-dtb = { path = "../crates/zoraya-dtb" }
zoraya-elf = { path = "../crates/zoraya-elf" }
zoraya-heap = { path = "../crates/zoraya-heap" }
zoraya-pagetable = { path = "../crates/zoraya-pagetable" }
zoraya-pmm = { path = "../crates/zoraya-pmm" }
zoraya-ramdisk = { path = "../crates/zoraya-ramdisk" }
zoraya-time = { path = "../crates/zoraya-time" }

[lints]
workspace = true
