[workspace]
resolver = "3"
members = [
    "kernel",
    "crates/zoraya-abi",
    "crates/zoraya-dtb",
    "crates/zoraya-elf",
    "crates/zoraya-heap",
    "crates/zoraya-pagetable",
    "crates/zoraya-pmm",
    "crates/zoraya-ramdisk",
    "crates/zoraya-time",
    "tools/test-runner",
    "tools/adr-check",
    "tools/mkramdisk",
    "user",
]
# The kernel and user programs only build for aarch64-unknown-none; plain
# `cargo test` and `cargo build` act on the host-side members. The Makefile
# builds the others.
default-members = [
    "crates/zoraya-abi",
    "crates/zoraya-dtb",
    "crates/zoraya-elf",
    "crates/zoraya-heap",
    "crates/zoraya-pagetable",
    "crates/zoraya-pmm",
    "crates/zoraya-ramdisk",
    "crates/zoraya-time",
    "tools/test-runner",
    "tools/adr-check",
    "tools/mkramdisk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# User programs go into the ramdisk, which goes into the kernel image.
[profile.user]
inherits = "release"
opt-level = 1
debug = false
strip = true
