[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "BSD-2-Clause"

# The filesystem's crash and fuzz tests mount tens of thousands of images;
# unoptimised they take minutes. Optimise these two crates in test builds too.
[profile.dev.package.zoraya-fs]
opt-level = 2

[profile.dev.package.zoraya-fs-testkit]
opt-level = 2

# The GUI test runner reads every screendump cell by cell through these
# (zoraya-term's reader): unoptimised, a GUI script spent most of its time
# there (2026-11-09).
[profile.dev.package.zoraya-term]
opt-level = 2

[profile.dev.package.zoraya-text]
opt-level = 2

[profile.dev.package.zoraya-test-runner]
opt-level = 2

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# User programs go into the ramdisk, which goes into the kernel image.
[profile.user]
inherits = "release"
opt-level = 1
debug = false
strip = true
