# Coverage-guided fuzzing of the zoraya-fs decoder and the shell's parsers
# with cargo-fuzz.
#
# Needs a nightly toolchain and cargo-fuzz, so it is not part of the
# workspace and `make test` does not run it; the workspace's own
# deterministic fuzz test (crates/zoraya-fs/tests/decoder_fuzz.rs) does.
# How to run: see README.md here.

[package]
name = "zoraya-fs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "BSD-2-Clause"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
zoraya-fs = { path = "../crates/zoraya-fs" }
zoraya-fs-testkit = { path = "../crates/zoraya-fs-testkit" }
zoraya-describe = { path = "../crates/zoraya-describe" }
zoraya-shell = { path = "../crates/zoraya-shell" }
zoraya-proto-nic = { path = "../crates/zoraya-proto-nic" }
zoraya-protocol = { path = "../crates/zoraya-protocol" }
zoraya-proto-net = { path = "../crates/zoraya-proto-net" }
zoraya-virtio = { path = "../crates/zoraya-virtio", features = ["fake"] }
zoraya-virtio-net = { path = "../crates/zoraya-virtio-net" }
zoraya-abi = { path = "../crates/zoraya-abi" }
zoraya-net = { path = "../crates/zoraya-net" }
zoraya-dns = { path = "../crates/zoraya-dns" }
zoraya-http = { path = "../crates/zoraya-http" }

[[bin]]
name = "mount_walk"
path = "fuzz_targets/mount_walk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "raw_image"
path = "fuzz_targets/raw_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "describe"
path = "fuzz_targets/describe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shell_parse"
path = "fuzz_targets/shell_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "editor_keys"
path = "fuzz_targets/editor_keys.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "net_rx"
path = "fuzz_targets/net_rx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "net_stack"
path = "fuzz_targets/net_stack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "net_dns_http"
path = "fuzz_targets/net_dns_http.rs"
test = false
doc = false
bench = false
