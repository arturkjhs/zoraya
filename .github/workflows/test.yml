# Runs `make test` on Linux; QEMU uses TCG there (tools/run-qemu.sh picks
# hvf only on an Apple Silicon Mac).
name: make test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, and clang for libc.a (make test-libposix, stage 6c)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm clang
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # ADR-0109: the fetch step is outside make test, as the toolchain's
      # install is; make test-libposix builds libc.a from musl's archive.
      - name: Cache the ports' archives
        uses: actions/cache@v4
        with:
          path: build/ports/src
          key: ports-src-${{ hashFiles('ports/sources.lock') }}
      - name: make fetch-ports
        run: make fetch-ports
      # make test-posix has a job of its own (ADR-0212's Decision).
      - name: make test
        run: make test TEST_SKIP=test-posix
      - name: The logs of what failed
        if: failure()
        run: for f in build/logs/*.log; do echo "== $f"; tail -n 300 "$f"; done

  # Stage 6e (ADR-0110, ADR-0212): the POSIX session's workloads, W5, W8,
  # W9, W10 and tcc hello.c, in a job of their own: under TCG they do not
  # fit beside the rest of make test in one job's 30 minutes.
  posix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, and clang for libc.a and the ports
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm clang
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache the ports' archives
        uses: actions/cache@v4
        with:
          path: build/ports/src
          key: ports-src-${{ hashFiles('ports/sources.lock') }}
      - name: make fetch-ports
        run: make fetch-ports
      - name: make test-posix
        run: make test-posix
      - name: The runner's logs of what failed
        if: failure()
        run: |
          shopt -s nullglob
          for f in target/test-logs/posix-*.log; do echo "== $f"; tail -n 200 "$f"; done

  # Stage 6b (ADR-0109): the ports, in a job of their own so that the QEMU
  # tests above keep their time. The cache holds the downloaded archives,
  # keyed by the lock; make fetch-ports verifies every hash either way.
  ports:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: The host tools the ports need (clang; GNU make, sed, curl and bzip2 are in the image)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
          clang --version && make --version | head -1 && sed --version | head -1
      - name: Cache the ports' archives
        uses: actions/cache@v4
        with:
          path: build/ports/src
          key: ports-src-${{ hashFiles('ports/sources.lock') }}
      - name: make fetch-ports
        run: make fetch-ports
      - name: make ports (builds, then make check-ports)
        run: make ports
      - name: The logs of what failed
        if: failure()
        run: |
          shopt -s nullglob
          for f in build/ports/logs/*.log; do echo "== $f"; tail -n 100 "$f"; done
