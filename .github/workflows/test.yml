# CI on Linux (QEMU uses TCG there: tools/run-qemu.sh picks hvf only on an
# Apple Silicon Mac), split into small parallel jobs (ADR-0213's Decision):
# one job builds everything once and hands build/ and target/ on; every step
# of make test is a job of its own, test-qemu one a machine configuration and
# test-posix one a script (with an accelerator where one run would be long).
# `make check-ci-jobs` fails if this file leaves out a step, a configuration,
# a script under an accelerator, or one of W8's builds.
#
# What runs where (2026-11-11, so that the tests do not block development):
# every push runs the quick checks. A merge candidate (a tag `candidate/NAME`
# pushed on a branch's head, or a pull request) runs the quick checks and the
# jobs its change needs: the job `plan` runs tools/ci-plan.sh, which maps the
# changed paths to steps (tools/test-map.txt, as make test-changed does) and
# adds a smoke set (boot, the shell's files script, one GUI run, the POSIX
# hello script). The full set (every job of tools/ci-tests.txt, what make test
# runs) runs on main, nightly (schedule, on main), on demand (a manual run
# with full=true) and on a tag `candidate-full/NAME`, which the orchestrator
# pushes before a stage's tag. A manual run without full=true is planned like
# a candidate. A new push to a branch cancels its older run; on main every
# merge keeps its own run, since a stage's tag waits for that run.
name: make test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every job (make test), not only what the change needs'
        type: boolean
        default: false
  schedule:
    # Nightly, on main. A red run is the first item of the next session
    # (docs/tasks/TASK-26-report.md): gh run list --workflow 'make test' --event schedule
    - cron: '17 2 * * *'

concurrency:
  # Per branch and event: a push's quick checks and a manual full run on
  # the same branch do not cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The jobs the tests job runs: all of tools/ci-tests.txt, or what the change
  # needs plus the smoke set (tools/ci-plan.sh).
  plan:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/candidate/') || startsWith(github.ref, 'refs/tags/candidate-full/') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Plan
        id: plan
        env:
          FULL_INPUT: ${{ inputs.full }}
        run: |
          full=0
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/candidate-full/*) full=1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$FULL_INPUT" = true ]; then full=1; fi
          FULL=$full tools/ci-plan.sh origin/main | tee plan.txt >> "$GITHUB_OUTPUT"
          grep '^summary=' plan.txt | sed 's/^summary=//' >> "$GITHUB_STEP_SUMMARY"

  # The ports, the sysroot, libc.a, the kernels, the user programs, the host
  # tools and tests (built, not run) and the POSIX image (make ci-build), as
  # one archive whose files keep their times.
  build:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang (zcc, libc.a and the ports) and zstd
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zstd
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # target/: the dependencies and the workspace's crates (the key is
      # Cargo.lock, the toolchain and the job).
      - uses: Swatinem/rust-cache@v2.7.5
        with:
          shared-key: build
      # ADR-0109: the fetch step is outside make test, as the toolchain's install is.
      - name: Cache the ports' archives
        uses: actions/cache@v4
        with:
          path: build/ports/src
          key: ports-src-${{ hashFiles('ports/sources.lock') }}
      - name: make fetch-ports
        run: make fetch-ports
      # The ports' build (make reads times): the key is every file under
      # ports/ (sources.lock among them) and tools/zcc/, and those files get
      # an old time first, so that the restored outputs are newer than them.
      # Other files make's rules read keep their checkout time, which only
      # rebuilds more. Not the other sources: cargo would take an old time
      # for an unchanged file. A key that misses
      # builds everything, as before. If a restored build is ever wrong, change
      # the prefix `ports-build-v1`.
      - name: Give the sources an old time, for the ports' cache
        run: git ls-files -z ports tools/zcc | xargs -0 touch -h -t 200001010000
      - name: Cache the ports' build
        uses: actions/cache@v4
        with:
          path: |
            build/ports/work
            build/ports/obj
            build/ports/bin
            build/ports/logs
            build/sysroot
            build/rootfs-posix
            build/workloads
          key: ports-build-v1-${{ hashFiles('ports/**', 'tools/zcc/**') }}
      - name: make ci-build
        run: make ci-build
      - name: Pack build/ and target/
        run: tar --zstd -cf build.tar.zst --exclude=target/debug/incremental build target
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tar.zst
          retention-days: 2
          compression-level: 0
      - name: The ports' logs of what failed
        if: failure()
        run: |
          shopt -s nullglob
          for f in build/ports/logs/*.log; do echo "== $f"; tail -n 100 "$f"; done

  # Steps that need nothing built.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cmd:
          - make fmt-check
          - make clippy
          - make adr-check
          - make check-user-access
          - make check-kernel-tty
          - make check-host-paths
          - make check-argv
          - make check-test-caps
          - make check-tokens
          - make check-fetch-ports
          - make check-ci-jobs
          - make check-charged-alloc
          - make check-untrusted-gate
    name: ${{ matrix.cmd }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.7.5
        with:
          shared-key: checks
          save-if: ${{ matrix.cmd == 'make clippy' }}
      - name: Run
        run: ${{ matrix.cmd }}

  # Steps that run what the build job built. Before the archive is unpacked
  # the checkout's files get an old time, so that make and cargo find what
  # was built from them up to date and only run the tests.
  tests:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    # The tour's sessions are long under TCG, which is every accelerator on
    # GitHub's x86 runners (review K2), and so are test-gui's scripts, at
    # scale 2 most (2026-11-09: 10 minutes ended it); every other job stays
    # within 10.
    timeout-minutes: ${{ (contains(matrix.cmd, 'tour') || contains(matrix.cmd, 'test-gui')) && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        cmd: ${{ fromJSON(needs.plan.outputs.tests) }}
    name: ${{ matrix.cmd }}
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, clang and zstd
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm clang zstd
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Unpack, the sources older than what was built from them
        run: |
          git ls-files -z | xargs -0 touch -h -t 200001010000
          tar --zstd -xf build.tar.zst
      - name: Run
        run: ${{ matrix.cmd }}
      - name: The logs of what failed
        if: failure()
        run: |
          shopt -s nullglob
          for f in target/test-logs/*.log build/ports/logs/*.log; do echo "== $f"; tail -n 150 "$f"; done
