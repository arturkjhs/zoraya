# CI on Linux (QEMU uses TCG there: tools/run-qemu.sh picks hvf only on an
# Apple Silicon Mac), split into small parallel jobs (ADR-0213's Decision):
# one job builds everything once and hands build/ and target/ on; every step
# of make test is a job of its own, test-qemu one a machine configuration and
# test-posix one a script (with an accelerator where one run would be long).
# `make check-ci-jobs` fails if this file leaves out a step, a configuration,
# a script under an accelerator, or one of W8's builds.
#
# What runs where (2026-11-11, so that the tests do not block development):
# every push runs the quick checks. A merge candidate (a tag `candidate/NAME`
# pushed on a branch's head, or a pull request) runs the quick checks and the
# jobs its change needs: the job `plan` runs tools/ci-plan.sh, which maps the
# changed paths to steps (tools/test-map.txt, as make test-changed does) and
# adds a smoke set (boot, the shell's files script, one GUI run, the POSIX
# hello script). The full set (every job of tools/ci-tests.txt, what make test
# runs) runs on a push to main, nightly (schedule, on main), on demand (a
# manual run with full=true) and on a tag `candidate-full/NAME`, which the
# orchestrator pushes before a stage's tag. The one exception: a push to main
# whose every changed path is under docs/ and that changes no posix-surface
# block of an ADR (tools/plan-lib.sh, docs_only) runs only the document checks
# (the plan's doc_checks); build and tests are skipped, so the run is green. A manual run without full=true is planned like
# a candidate. A new push to a branch cancels its older run; on main every
# merge keeps its own run, since a stage's tag waits for that run.
#
# The image (.github/ci/Dockerfile, built by ci-image.yml): the job `image`
# computes its tag (tools/ci-image-tag.sh) and looks for it in ghcr.io. If it
# exists, `build`, `checks` and `tests` run in it, with everything installed
# (no apt at run time); if not (or ghcr.io cannot be read), `container:` is
# null, the jobs run on the bare runner, and the steps guarded by
# `needs.image.outputs.ref == ''` install what the image would have, with
# tools/ci-apt-install.sh (retries, then other mirrors).
name: make test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every job (make test), not only what the change needs'
        type: boolean
        default: false
  schedule:
    # Nightly, on main. A red run is the first item of the next session
    # (docs/tasks/TASK-26-report.md): gh run list --workflow 'make test' --event schedule
    - cron: '17 2 * * *'

concurrency:
  # Per branch and event: a push's quick checks and a manual full run on
  # the same branch do not cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# bash everywhere: in the image container a step's default shell is `sh -e`
# (dash), which has no `shopt`.
defaults:
  run:
    shell: bash

jobs:
  # Looks for the CI image of this checkout; outputs its reference, or nothing.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.find.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the image
        id: find
        env:
          TOKEN: ${{ github.token }}
        run: |
          repo=$(echo "ghcr.io/$GITHUB_REPOSITORY/ci" | tr '[:upper:]' '[:lower:]')
          ref="$repo:$(tools/ci-image-tag.sh)"
          # Any failure (no such tag, no access, ghcr.io down) means: no image.
          if echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin \
            && timeout 60 docker manifest inspect "$ref" >/dev/null; then
            echo "image: $ref"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "no image $ref: the jobs install their tools themselves"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

  # The jobs the tests job runs: all of tools/ci-tests.txt, or what the change
  # needs plus the smoke set (tools/ci-plan.sh).
  plan:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/candidate/') || startsWith(github.ref, 'refs/tags/candidate-full/') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      build: ${{ steps.plan.outputs.build }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      doc_checks: ${{ steps.plan.outputs.doc_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Plan
        id: plan
        env:
          FULL_INPUT: ${{ inputs.full }}
          BEFORE: ${{ github.event.before }}
        run: |
          full=0
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/candidate-full/*) full=1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$FULL_INPUT" = true ]; then full=1; fi
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            # A push to main: the full set unless only docs/ changed.
            full=0
            DOCS_BEFORE=$BEFORE DOCS_AFTER=$GITHUB_SHA tools/ci-plan.sh origin/main | tee plan.txt >> "$GITHUB_OUTPUT"
          else
            FULL=$full tools/ci-plan.sh origin/main | tee plan.txt >> "$GITHUB_OUTPUT"
          fi
          grep '^summary=' plan.txt | sed 's/^summary=//' >> "$GITHUB_STEP_SUMMARY"

  # The ports, the sysroot, libc.a, the kernels, the user programs, the host
  # tools and tests (built, not run) and the POSIX image (make ci-build), as
  # one archive whose files keep their times.
  build:
    needs: [plan, image]
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    # A cold ports cache builds OpenSSL, curl and wget (TASK-27 9a), NetSurf with
    # its libraries (9d, 45 minutes alone) and the host and the cross CPython
    # (9c, N7: the two together not yet measured cold on CI), hence 60.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container: ${{ needs.image.outputs.ref && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', needs.image.outputs.ref, github.actor, github.token)) || null }}
    steps:
      - uses: actions/checkout@v4
      # The runner's apt cannot always resolve the Ubuntu mirrors (temporary
      # DNS failures): the .deb files are cached (the key names the package
      # list), apt retries, the step tries 5 times 30 s apart, and the last
      # attempt installs from the cache without the network.
      # Without the image: the runner's apt cannot always reach the Ubuntu
      # mirrors, so the .deb files are cached (the key names the package
      # list) and tools/ci-apt-install.sh retries, tries other mirrors and
      # last installs from the cache without the network.
      - name: Restore the apt packages
        if: ${{ needs.image.outputs.ref == '' }}
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ runner.arch }}-clang-zstd-netsurf-cmake-v1
      - name: Install clang (zcc, libc.a and the ports), zstd and NetSurf's build tools
        if: ${{ needs.image.outputs.ref == '' }}
        run: |
          # GitHub's Ubuntu images carry them: when they are there the network
          # is not needed (the runners' mirrors have been slow or unreachable).
          # gperf, flex, bison and pkg-config are NetSurf's libraries' (9d: the
          # build job of a9 failed on `gperf: No such file`); the same list as
          # .github/ci/Dockerfile.
          missing=
          for t in clang zstd gperf flex bison pkg-config cmake; do
            command -v "$t" >/dev/null || missing="$missing $t"
          done
          if [ -z "$missing" ]; then
            echo "clang $(clang --version | head -1), zstd, gperf, flex, bison, pkg-config and cmake are installed: no apt"
            exit 0
          fi
          echo "missing:$missing"
          APT_DEB_CACHE="$HOME/apt-debs" tools/ci-apt-install.sh clang zstd gperf flex bison pkg-config cmake
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: ${{ needs.image.outputs.ref == '' }}
        run: rustup toolchain install
      # target/: the dependencies and the workspace's crates (the key is
      # Cargo.lock, the toolchain and the job).
      - uses: Swatinem/rust-cache@v2.7.5
        with:
          shared-key: build
          key: ${{ needs.image.outputs.ref != '' && 'container' || 'bare' }}
      # ADR-0109: the fetch step is outside make test, as the toolchain's install is.
      # The archives are kept in Actions' cache, so that an upstream outage
      # (ftp.gnu.org timed out on main's run 43511821485) does not reach the
      # job: the exact key (the hash of ports/sources.lock) hits when the lock
      # is unchanged; a lock that changed restores the newest entry of an older
      # lock (the restore key), and `make fetch-ports` downloads only what that
      # entry lacks. Whatever came back is not trusted: fetch-ports.sh checks
      # every archive against the lock's SHA-256 and downloads again an archive
      # that fails (a corrupted entry). The entry is saved after the fetch even
      # when a later step fails (tools/check-fetch-cache.sh checks that every
      # fetch has this restore step).
      - name: Restore the ports' archives
        id: ports-src
        uses: actions/cache/restore@v4
        with:
          path: build/ports/src
          key: ports-src-${{ hashFiles('ports/sources.lock') }}
          restore-keys: ports-src-
      - name: make fetch-ports
        run: make fetch-ports
      - name: Save the ports' archives
        if: ${{ always() && steps.ports-src.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/ports/src
          key: ports-src-${{ hashFiles('ports/sources.lock') }}
      # The ports' build (make reads times): the key is every file under
      # ports/ (sources.lock among them) and tools/zcc/, and those files get
      # an old time first, so that the restored outputs are newer than them.
      # The ADRs whose name lists libc.a's check reads (ports/Makefile's
      # TIER_LIST and ADDED_ADRS) are in the key and get the old time too:
      # with their checkout time every hit rebuilt libc.a and all after it.
      # The python port's trees are not in the cache (W10): when its stamp
      # must be rebuilt, its recipe makes them again (make check-python-cache).
      # Other files make's rules read keep their checkout time, which only
      # rebuilds more. Not the other sources: cargo would take an old time
      # for an unchanged file. A key that misses
      # builds everything, as before. If a restored build is ever wrong, change
      # the prefix `ports-build-v3`. The key also names the layout (container or bare): the build holds absolute paths, so a cache is never restored into the other layout.
      - name: Give the sources an old time, for the ports' cache
        run: git ls-files -z ports tools/zcc tests/python/regr-modules.txt tests/python/regr-long.txt tests/python/regr-ignore.txt 'docs/adr/posix-surface-T*.txt' 'docs/adr/0142-*.md' 'docs/adr/0144-*.md' 'docs/adr/0210-*.md' 'docs/adr/0287-*.md' 'docs/adr/0310-*.md' 'docs/adr/0317-*.md' 'docs/adr/0320-*.md' 'docs/adr/0366-*.md' | xargs -0 touch -h -t 200001010000
      - name: Cache the ports' build
        uses: actions/cache@v4
        with:
          path: |
            build/ports/work
            build/ports/obj
            build/ports/bin
            build/ports/logs
            build/ports/deps
            build/sysroot
            build/rootfs-posix
            build/rootfs-apps
            build/rootfs-python
            build/python-testlib
            build/gtest-tests
            build/workloads
            build/ports/workloads
            !build/ports/work/Python-*
            !build/ports/work/hostpython-build
            !build/ports/work/python-build
          key: ports-build-v3-${{ needs.image.outputs.ref != '' && 'container' || 'bare' }}-${{ hashFiles('ports/**', 'tools/zcc/**', 'tests/python/regr-*.txt', 'docs/adr/posix-surface-T*.txt', 'docs/adr/0142-*.md', 'docs/adr/0144-*.md', 'docs/adr/0210-*.md', 'docs/adr/0287-*.md', 'docs/adr/0310-*.md', 'docs/adr/0317-*.md', 'docs/adr/0320-*.md', 'docs/adr/0366-*.md') }}
      - name: make ci-build
        run: make ci-build
      - name: Pack build/ and target/
        # Not the python port's source, host and build trees, nor its stage
        # (about 600 MB): the tests read build/rootfs-python and
        # build/python-testlib, and ports/Makefile's markers
        # (build/ports/obj/python-src.stamp, hostpython.stamp) tell make they are built.
        # build/ports/host (NetSurf's host tools, 9d) stays: test-netsurf's make reads
        # its libpng16.a; the host python has a prefix of its own (build/ports/hostpython).
        # NetSurf's build/rootfs-apps/bin/netsurf and usr/share/netsurf are in build/.
        run: tar --zstd -cf build.tar.zst --exclude=target/debug/incremental --exclude='build/ports/work/Python-*' --exclude=build/ports/work/hostpython-build --exclude=build/ports/work/python-build --exclude=build/ports/hostpython --exclude=build/ports/python-stage --exclude=build/ports/work/googletest-build build target
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tar.zst
          retention-days: 2
          compression-level: 0
      - name: The ports' logs of what failed
        if: failure()
        run: |
          shopt -s nullglob
          for f in build/ports/logs/*.log; do echo "== $f"; tail -n 100 "$f"; done

  # Steps that need nothing built.
  checks:
    needs: [image, plan]
    # plan is skipped on a branch push; a docs-only push to main keeps only
    # the commands in the plan's doc_checks (the steps below).
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.plan.result == 'success' || needs.plan.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container: ${{ needs.image.outputs.ref && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', needs.image.outputs.ref, github.actor, github.token)) || null }}
    strategy:
      fail-fast: false
      matrix:
        cmd:
          - make fmt-check
          - make clippy
          - make adr-check
          - make check-user-access
          - make check-kernel-tty
          - make check-host-paths
          - make check-argv
          - make check-test-caps
          - make check-tokens
          - make check-fetch-ports
          - make check-ci-jobs
          - make check-python-cache
          - make check-charged-alloc
          - make check-untrusted-gate
          - make check-quota-tests
          - make check-ethd-maps
          - make check-tls-roots
          - make check-run-disk
          - make check-ci-plan
    name: ${{ matrix.cmd }}
    env:
      RUN_IT: ${{ needs.plan.outputs.docs_only != '1' || contains(needs.plan.outputs.doc_checks, matrix.cmd) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: ${{ needs.image.outputs.ref == '' && env.RUN_IT == 'true' }}
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.7.5
        if: ${{ env.RUN_IT == 'true' }}
        with:
          shared-key: checks
          key: ${{ needs.image.outputs.ref != '' && 'container' || 'bare' }}
          save-if: ${{ matrix.cmd == 'make clippy' }}
      - name: Run
        if: ${{ env.RUN_IT == 'true' }}
        run: ${{ matrix.cmd }}

  # Steps that run what the build job built. Before the archive is unpacked
  # the checkout's files get an old time, so that make and cargo find what
  # was built from them up to date and only run the tests.
  tests:
    needs: [plan, build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container: ${{ needs.image.outputs.ref && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', needs.image.outputs.ref, github.actor, github.token)) || null }}
    # The tour's sessions are long under TCG, which is every accelerator on
    # GitHub's x86 runners (review K2), and so are test-gui's scripts, at
    # scale 2 most (2026-11-09: 10 minutes ended it), and test-hand-run's
    # three boots, one with the desktop; every other job stays within 10.
    # a test-posix script under TCG also takes 30 (2026-11-13: w9-term.script ended at 10 on a slow runner).
    # The python steps (test-python, test-python-regr) take 45: under TCG
    # regrtest's CI subset and the TLS clients each need most of 30 (ADR-0320
    # item 9; run 43488132441 was cancelled at 30 with both in one job).
    timeout-minutes: ${{ (contains(matrix.cmd, 'test-python') || contains(matrix.cmd, 'test-cxx-')) && 45 || (contains(matrix.cmd, 'test-cxx') || contains(matrix.cmd, 'tour') || (contains(matrix.cmd, 'test-posix') && contains(matrix.cmd, 'tcg')) || contains(matrix.cmd, 'test-gui') || contains(matrix.cmd, 'test-fuzz') || contains(matrix.cmd, 'test-net') || contains(matrix.cmd, 'test-hand-run') || contains(matrix.cmd, 'test-apps') || contains(matrix.cmd, 'test-netsurf') || contains(matrix.cmd, 'threads.script') || contains(matrix.cmd, 'threadtest3')) && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        cmd: ${{ fromJSON(needs.plan.outputs.tests) }}
    name: ${{ matrix.cmd }}
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, clang and zstd
        if: ${{ needs.image.outputs.ref == '' }}
        run: tools/ci-apt-install.sh qemu-system-arm clang zstd
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: ${{ needs.image.outputs.ref == '' }}
        run: rustup toolchain install
      - name: Install the nightly toolchain and fetch the fuzz crates (ADR-0298)
        if: ${{ contains(matrix.cmd, 'test-fuzz') }}
        run: |
          rustup toolchain install nightly-2026-11-12 --profile minimal
          (cd fuzz && cargo +nightly-2026-11-12 fetch --locked)
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Unpack, the sources older than what was built from them
        run: |
          git ls-files -z | xargs -0 touch -h -t 200001010000
          tar --zstd -xf build.tar.zst
      - name: Run
        run: ${{ matrix.cmd }}
      - name: The logs of what failed
        if: failure()
        run: |
          shopt -s nullglob
          for f in target/test-logs/*.log build/ports/logs/*.log; do echo "== $f"; tail -n 150 "$f"; done
