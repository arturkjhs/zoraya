# EXPERIMENT (docs/research/ci-arm.md): do GitHub's free arm64 runners
# (ubuntu-24.04-arm) run our QEMU jobs faster than ubuntu-24.04 (x86-64, TCG)?
# Manual only: never on a push or a tag, and it is not part of `make test`
# (test.yml is unchanged). Each leg is one job that installs the tools on the
# bare runner (no CI image: it is x86-64 only), builds once (make ci-build) and
# runs the four commands as steps of their own, so that `gh run view --json
# jobs` gives each one's start and completion time.
name: ci arm

on:
  workflow_dispatch:
    inputs:
      accel:
        description: 'ZORAYA_ACCEL_AUTO for the arm leg that must not use KVM (tcg), empty for none'
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Always the same toolchain as test.yml (rust-toolchain.toml).
  CARGO_TERM_COLOR: never

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: What the arm runner is
        run: |
          set +e
          uname -a; uname -m
          echo "--- /dev/kvm"; ls -l /dev/kvm; id
          [ -w /dev/kvm ] && echo "kvm writable by this user" || echo "kvm NOT writable/absent"
          echo "--- lscpu"; lscpu
          echo "--- memory/disk"; free -g; nproc; df -h . | tail -1
          echo "--- apt qemu"
          tools/ci-apt-install.sh qemu-system-arm >/dev/null 2>&1
          qemu-system-aarch64 --version | head -1
          echo "--- kvm probe"
          timeout 20 qemu-system-aarch64 -accel kvm -machine virt,gic-version=host -cpu host -nographic -S -monitor none -serial none -display none &
          pid=$!
          sleep 5
          if kill -0 $pid 2>/dev/null; then echo "KVM PROBE: qemu started with kvm"; kill $pid; else wait $pid; echo "KVM PROBE: qemu exited $?"; fi
          echo "--- kvm probe (gic default)"
          timeout 20 qemu-system-aarch64 -accel kvm -machine virt -cpu host -nographic -S -monitor none -serial none -display none &
          pid=$!
          sleep 5
          if kill -0 $pid 2>/dev/null; then echo "KVM PROBE2: qemu started with kvm"; kill $pid; else wait $pid; echo "KVM PROBE2: qemu exited $?"; fi
          true

  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ZORAYA_ACCEL_AUTO: ${{ inputs.accel }}
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, clang and the build tools
        run: |
          uname -m; qemu-system-aarch64 --version 2>/dev/null | head -1
          tools/ci-apt-install.sh build-essential ca-certificates clang lld llvm zstd qemu-system-arm \
            git curl patch perl python3 ruby xz-utils bzip2 gzip unzip zip file gawk pkg-config
          qemu-system-aarch64 --version | head -1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: make fetch-ports
        run: make fetch-ports
      - name: make ci-build
        run: make ci-build
      - name: make test-qemu-auto-default
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: make test-qemu-auto-default
      - name: make test-qemu-tcg-smp4-gicv3
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: make test-qemu-tcg-smp4-gicv3
      - name: make test-net
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: make test-net
      - name: make test-posix threads
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: make test-posix POSIX_SCRIPTS=tests/posix/threads.script POSIX_ACCELS="auto tcg"
      - name: The logs of what failed
        if: failure()
        run: |
          shopt -s nullglob
          for f in target/test-logs/*.log; do echo "== $f"; tail -n 60 "$f"; done
