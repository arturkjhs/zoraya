# zoraya-net: the per-request round trips of a ping run (INV-0330-1). Host tests
# only. A request without a reply is marked u32::MAX in its place; the mutant
# marks it 0 (an instant reply) and the tests of lost and partly lost runs
# must see it.
tests = ["cargo test -q -p zoraya-net --lib ping"]
timeout = 600

[[mutant]]
id = "N-ping-lost-mark"
file = "crates/zoraya-net/src/stack.rs"
find = '.map(|i| run.rtt.get(i).copied().flatten().unwrap_or(u32::MAX))'
replace = '.map(|i| run.rtt.get(i).copied().flatten().unwrap_or(0))'
note = "review of hand-run W2"

# ADR-0330: an echo grant is echo only, and an echo needs an echo grant.
[[mutant]]
id = "N-echo-address-any-protocol"
file = "crates/zoraya-abi/src/net.rs"
find = '.any(|r| r.target.covers_address(address) && r.protocols.contains(Protocols::ECHO))'
replace = '.any(|r| r.target.covers_address(address))'
note = "ping under a TCP/UDP-only grant"
tests = ["cargo test -q -p zoraya-abi --lib net", "cargo test -q -p zoraya-net --lib ping"]

[[mutant]]
id = "N-echo-name-any-protocol"
file = "crates/zoraya-abi/src/net.rs"
find = '.any(|r| r.target.covers_name(name) && r.protocols.contains(Protocols::ECHO))'
replace = '.any(|r| r.target.covers_name(name))'
note = "ping by name under a TCP/UDP-only grant"
tests = ["cargo test -q -p zoraya-abi --lib net", "cargo test -q -p zoraya-net --lib ping"]

[[mutant]]
id = "N-listen-takes-echo"
file = "crates/zoraya-abi/src/net.rs"
find = 'if !protocols.within(Protocols::BOTH) {'
replace = 'if false {'
note = "a listen rule with the echo bit"
tests = ["cargo test -q -p zoraya-abi --lib net"]
