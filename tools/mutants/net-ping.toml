# zoraya-net: the per-request round trips of a ping run (INV-0330-1). Host tests
# only. A request without a reply is marked u32::MAX in its place; the mutant
# marks it 0 (an instant reply) and the tests of lost and partly lost runs
# must see it.
tests = ["cargo test -q -p zoraya-net --lib ping"]
timeout = 600

[[mutant]]
id = "N-ping-lost-mark"
file = "crates/zoraya-net/src/stack.rs"
find = '.map(|i| run.rtt.get(i).copied().flatten().unwrap_or(u32::MAX))'
replace = '.map(|i| run.rtt.get(i).copied().flatten().unwrap_or(0))'
note = "review of hand-run W2"

# ADR-0330: an echo grant is echo only, and an echo needs an echo grant.
[[mutant]]
id = "N-echo-address-any-protocol"
file = "crates/zoraya-abi/src/net.rs"
find = '.any(|r| r.target.covers_address(address) && r.protocols.contains(Protocols::ECHO))'
replace = '.any(|r| r.target.covers_address(address))'
note = "ping under a TCP/UDP-only grant"
tests = ["cargo test -q -p zoraya-abi --lib net", "cargo test -q -p zoraya-net --lib ping"]

[[mutant]]
id = "N-echo-name-any-protocol"
file = "crates/zoraya-abi/src/net.rs"
find = '.any(|r| r.target.covers_name(name) && r.protocols.contains(Protocols::ECHO))'
replace = '.any(|r| r.target.covers_name(name))'
note = "ping by name under a TCP/UDP-only grant"
tests = ["cargo test -q -p zoraya-abi --lib net", "cargo test -q -p zoraya-net --lib ping"]

[[mutant]]
id = "N-listen-takes-echo"
file = "crates/zoraya-abi/src/net.rs"
find = 'if !protocols.within(Protocols::BOTH) {'
replace = 'if false {'
note = "a listen rule with the echo bit"
tests = ["cargo test -q -p zoraya-abi --lib net"]

# The local-answer refusal of a ping by name (conn_tests::ping_by_name).
[[mutant]]
id = "N-named-ping-local-answer"
file = "crates/zoraya-net/src/service.rs"
find = '''|| !is_local(stack, *a, now_us)
                    || scope.allows_echo_address(*a))'''
replace = '''|| true
                    || scope.allows_echo_address(*a))'''
note = "review of 62a7474 (3): the gateway and the DNS server pinged without an echo rule"
tests = ["cargo test -q -p zoraya-net --lib ping_by_name"]

[[mutant]]
id = "N-named-ping-any-rule-covers-local"
file = "crates/zoraya-net/src/service.rs"
find = "|| scope.allows_echo_address(*a))"
replace = "|| true)"
note = "review of 62a7474 (3): a TCP rule for a local answer counted as an echo rule"
tests = ["cargo test -q -p zoraya-net --lib ping_by_name"]

# The slot of a ping whose connection went (service.rs `remove`, `resolve_done`);
# conn_tests::ping_by_name.
[[mutant]]
id = "N-ping-remove-clears-slot"
file = "crates/zoraya-net/src/service.rs"
find = '''            *owner = None;
        }
    }'''
replace = '''            *owner = None;
            self.ping = None;
        }
    }'''
note = "remove frees the slot while the run goes on: the next asker is handed the run's result"
tests = ["cargo test -q -p zoraya-net --lib ping"]

[[mutant]]
id = "N-ping-named-no-running-check"
file = "crates/zoraya-net/src/service.rs"
find = '''                    || stack.ping_running()
'''
replace = '''
'''
note = "a named ping does not look at the stack's own run"
tests = ["cargo test -q -p zoraya-net --lib ping"]

[[mutant]]
id = "N-ping-lookup-end-keeps-slot"
file = "crates/zoraya-net/src/service.rs"
find = '''            self.ping = None;
            return None;'''
replace = '''            return None;'''
note = "the lookup of a gone connection ends without freeing the slot: Busy for ever"
tests = ["cargo test -q -p zoraya-net --lib ping"]
