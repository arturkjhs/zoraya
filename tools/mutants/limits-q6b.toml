id = "Q6b-popup-unchecked"
file = "crates/zoraya-compositor/src/lib.rs"
find = '''
            return Err(status::BAD_BUFFER);
        }
        if !self.within_account(slot, 1, u64::from(bw) * u64::from(bh)) {'''
replace = '''
            return Err(status::BAD_BUFFER);
        }
        if false {'''
note = "a_popup_counts_as_a_surface_of_its_room"

