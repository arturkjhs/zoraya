[[mutant]]
id = "Q6b-setbuffer-no-pixels"
file = "crates/zoraya-compositor/src/lib.rs"
find = 'if !self.within_account(slot, 0, account_more) {'
replace = 'if !self.within_account(slot, 0, 0) {'
note = "a_new_buffer_counts_in_the_account_until_it_replaces_the_old"

[[mutant]]
id = "Q6b-setbuffer-pending-ignored"
file = "crates/zoraya-compositor/src/lib.rs"
find = 'let account_more = (u64::from(bw) * u64::from(bh)).saturating_sub(pending);'
replace = 'let account_more = u64::from(bw) * u64::from(bh);'
note = "a_new_buffer_counts_in_the_account_until_it_replaces_the_old"

[[mutant]]
id = "Q6b-pixels-next-ignored"
file = "crates/zoraya-compositor/src/window.rs"
find = 'area(&self.buffer) + self.next.as_ref().map_or(0, area)'
replace = 'area(&self.buffer)'
note = "a_new_buffer_counts_in_the_account_until_it_replaces_the_old"

[[mutant]]
id = "Q6b-account-surfaces"
file = "crates/zoraya-compositor/src/usage.rs"
find = 'let ok = surfaces + more_surfaces <= ROOM_SURFACES'
replace = 'let ok = surfaces + more_surfaces <= ROOM_SURFACES + 1'
note = "an_untrusted_account_at_its_bound_is_refused_and_home_still_opens_one"

[[mutant]]
id = "Q6b-account-areas"
file = "crates/zoraya-compositor/src/usage.rs"
find = '&& pixels + more_pixels <= ROOM_AREAS * area'
replace = '&& pixels + more_pixels <= (ROOM_AREAS + 1) * area'
note = "a_room_holds_two_displays_of_pixels_and_no_more"

[[mutant]]
id = "Q6b-account-fifth"
file = "crates/zoraya-compositor/src/usage.rs"
find = '&& (!new_account || rooms.len() < UNTRUSTED_ACCOUNTS);'
replace = '&& (!new_account || rooms.len() <= UNTRUSTED_ACCOUNTS);'
note = "the_untrusted_rooms_together_leave_home_twenty_windows"

[[mutant]]
id = "Q6b-card-inside-body"
file = "crates/zoraya-compositor/src/usage.rs"
find = '''
            below
        } else {
            o.y
        };'''
replace = '''
            below
        } else {
            o.y + f.title
        };'''
note = "a_card_with_no_room_beside_its_window_covers_the_frame_first"

[[mutant]]
