# zoraya-compositor, Q6b: the accounts of untrusted rooms (ADR-0262 point 2,
# ADR-0294) and the hover card (ADR-0172 point 1). Hand mutants for the
# within_account calls of the three request paths and the card's place.
# Host tests only.
tests = ["cargo test -q -p zoraya-compositor usage"]
timeout = 600

[[mutant]]
id = "Q6b-toplevel-unchecked"
file = "crates/zoraya-compositor/src/lib.rs"
find = '''
            return Err(status::NO_MEMORY);
        }
        if !self.within_account(slot, 1, u64::from(bw) * u64::from(bh)) {'''
replace = '''
            return Err(status::NO_MEMORY);
        }
        if false {'''
note = "a_room_holds... / an_untrusted_account_at_its_bound_is_refused_and_home_still_opens_one"

