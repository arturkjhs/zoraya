tests = ["cargo test -q -p zoraya-settings-window"]
note = "7f lib.rs:60:9: the_page_shows_a_fixed_scale"

[[mutant]]
id = "W-layout-range"
file = "crates/zoraya-settings-window/src/lib.rs"
find = 'if (LAYOUT..LAYOUT + zoraya_keymap::LAYOUTS.len() as u32).contains(&id) =>'
replace = 'if (LAYOUT..LAYOUT * zoraya_keymap::LAYOUTS.len() as u32).contains(&id) =>'
tests = ["cargo test -q -p zoraya-settings-window"]
note = "7f lib.rs:113:32: a_control_past_the_last_layout_is_not_a_control"

[[mutant]]
id = "W-layout-on"
file = "crates/zoraya-settings-window/src/lib.rs"
find = 'if on && !n.layouts.contains(&l) {'
replace = 'if on || !n.layouts.contains(&l) {'
tests = ["cargo test -q -p zoraya-settings-window"]
note = "7f lib.rs:116:19: a_layout_turned_to_the_state_it_has_changes_nothing"

[[mutant]]
id = "A-title"
file = "crates/zoraya-app/src/lib.rs"
find = '''
            decode::<gui::TitleDone>(&r, 0)
                .ok()
                .map(|(_, d)| d.status.0)
        }) == Some(status::OK)'''
replace = '''
            decode::<gui::TitleDone>(&r, 0)
                .ok()
                .map(|(_, d)| d.status.0)
        }) != Some(status::OK)'''
tests = ["cargo test -q -p zoraya-app"]
note = "7f lib.rs:251:12: set_title_says_whether_the_compositor_kept_it"

