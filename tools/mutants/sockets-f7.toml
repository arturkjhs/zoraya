# Plan part F7 (INV-0412-3, INV-0439-1 to -3): socket files. The service's rights, bounds and handle
# accounting (`crates/zoraya-fs-service/tests/socket.rs`) and the library's path rule, record decoder and
# calls over the real service (`crates/zoraya-posix/tests/socketfile.rs` and the unit tests of `unix`).
# Host tests only. `make mutants` runs each against the committed tree.
#
# Not listed, equivalent: `!r.shared` in `decode_connect`'s stream clause (`Record::decode` already refuses a
# shared record that has its ancillary channel, which `has_anc` requires here); `NO_FOLLOW` in `unix_bind` (the
# exclusive create of an existing name, a link included, is `EXISTS` before any link is followed: defence in depth,
# with the check of the entry the node landed in); the library's own check that the object it opened is `S_IFSOCK`
# (`unix_connect`): the service answers a connect to anything else with `NOT_FOUND`, which is the same
# `ECONNREFUSED`; the check is defence in depth against a service that would not.
tests = ["cargo test -q -p zoraya-fs-service --test socket", "cargo test -q -p zoraya-posix --test socketfile --lib"]
timeout = 900

[[mutant]]
id = "F7-listen-without-write"
file = "crates/zoraya-fs-service/src/lib.rs"
find = '''        if !self.has(i, proto::rights::WRITE) {
            return self.done(i, t, status::ACCESS_DENIED, 0);
        }
        if !matches!(sock_type, 1 | 5)'''
replace = '''        if !matches!(sock_type, 1 | 5)'''
note = "INV-0439-1: a read-only connection may not listen"

