# The web rule (ADR-0324, INV-0324-1 to -3): host tests only. Each mutant
# widens what a web rule reaches or where the shell gives it; the tests of
# zoraya-abi, zoraya-net and zoraya-shell must see it. Checked by hand once
# each when written (all killed).
tests = ["cargo test -q -p zoraya-abi --lib net", "cargo test -q -p zoraya-net --lib web"]
timeout = 600

[[mutant]]
id = "W-every-address-public"
file = "crates/zoraya-abi/src/net.rs"
find = '.all(|&(block, len)| !prefix_has(block, len, address))'
replace = '.all(|&(_block, _len)| true)'
note = "the web rule would reach the local network"

[[mutant]]
id = "W-web-names-addresses"
file = "crates/zoraya-abi/src/net.rs"
find = '!matches!(self, Target::Public) && self.covers_address(address)'
replace = 'self.covers_address(address)'
note = "a public gateway or DNS server would pass the local rule"

[[mutant]]
id = "W-anything-within-web"
file = "crates/zoraya-abi/src/net.rs"
find = '(_, Target::Public) | (Target::Public, _) => false,'
replace = '(_, Target::Public) => true, (Target::Public, _) => false,'
note = "narrow from a web rule to an address or a name rule (INV-0324-2)"

[[mutant]]
id = "W-conn-private-answer"
file = "crates/zoraya-net/src/conn.rs"
find = '!named && (!is_public(a) || is_local(stack, a, now_us))'
replace = '!named && is_local(stack, a, now_us)'
note = "a name only the web rule admits connected to a private answer"

[[mutant]]
id = "W-conn-local-public-answer"
file = "crates/zoraya-net/src/conn.rs"
find = '!named && (!is_public(a) || is_local(stack, a, now_us))'
replace = '!named && !is_public(a)'
note = "a public DNS server or gateway as the answer"

[[mutant]]
id = "W-resolve-private-answer"
file = "crates/zoraya-net/src/service.rs"
find = 'scope.reaches_address(**a) || (zoraya_abi::net::is_public(**a) && !local)'
replace = 'scope.reaches_address(**a) || !local'
note = "resolve under the web rule answers a private address"

[[mutant]]
id = "W-resolve-local-not-granted"
file = "crates/zoraya-net/src/service.rs"
find = 'if usable.is_empty() && public_only {'
replace = 'if false {'
note = "the refusal reads as LOCAL (EAI_NONAME), so NetSurf cannot name it (ADR-0325)"

[[mutant]]
id = "W-shell-any-port"
file = "crates/zoraya-shell/src/netgrant.rs"
find = 'ports: Ports::ranges(&WEB_PORTS).unwrap_or(Ports::one(443)),'
replace = 'ports: Ports::ANY,'
note = "the web rule on every port"
tests = ["cargo test -q -p zoraya-shell --lib web"]

[[mutant]]
id = "W-shell-untrusted"
file = "crates/zoraya-shell/src/netgrant.rs"
find = 'if d.net_web && untrusted {'
replace = 'if false {'
note = "the web rule in an untrusted room (INV-0324-3)"
tests = ["cargo test -q -p zoraya-shell --lib web"]

[[mutant]]
id = "W-shell-any-description"
file = "crates/zoraya-shell/src/netgrant.rs"
find = 'if d.net_web && line.base_system {'
replace = 'if d.net_web {'
note = "a description outside the image takes the web"
tests = ["cargo test -q -p zoraya-shell --lib web"]

[[mutant]]
id = "W-connect-public-local"
file = "crates/zoraya-net/src/service.rs"
find = '                    verdict = Verdict::NotGranted;'
replace = '                    verdict = Verdict::Allowed;'
note = "a public gateway or DNS server by address under the web rule: a failed connection, not the grant's refusal"

[[mutant]]
id = "W-web-rule-any-protocol"
file = "crates/zoraya-abi/src/net.rs"
find = 'if matches!(target, Target::Public | Target::PublicName(_)) && protocols != Protocols::TCP {'
replace = 'if false {'
note = "a web rule over UDP or echo decodes, so netd takes one (INV-0324-1, 9f-net review finding 6)"

# The refusal page (ADR-0325, 9f-net review findings 1 and 4): host test of
# the page's text. Checked by hand once each when written (all killed).
[[mutant]]
id = "W-page-any-host"
file = "ports/netsurf/zoraya_refusal.c"
find = 'if (strcmp(h, "any") == 0 || strcmp(h, "web") == 0)'
replace = 'if (0)'
note = "the page offers +net any:PORT, every host on that port, for a host named any"
tests = ["make -s check-netsurf-refusal"]

[[mutant]]
id = "W-page-numeric-name"
file = "ports/netsurf/zoraya_refusal.c"
find = '		return dotted(h);'
replace = '		return 1;'
note = "a line the shell refuses (a name ending in a number that is no dotted address)"
tests = ["make -s check-netsurf-refusal"]

[[mutant]]
id = "W-page-long-url-line"
file = "ports/netsurf/zoraya_refusal.c"
find = 'int too_long = url_len > ZORAYA_REFUSAL_URL_MAX;'
replace = 'int too_long = 0;'
note = "a long URL gets no line and the false sentence, or no page (INV-0325-1)"
tests = ["make -s check-netsurf-refusal"]

[[mutant]]
id = "W-page-long-url-shown"
file = "ports/netsurf/zoraya_refusal.c"
find = 'put_html_cut(&o, url, ZORAYA_REFUSAL_URL_MAX,'
replace = 'put_html_cut(&o, url, 100000,'
note = "the whole long URL on the page: it no longer fits, NetSurf's bare error page (INV-0325-1)"
tests = ["make -s check-netsurf-refusal"]

# The server-log half of make test-netsurf's INV-0324-1 check (9f-net review,
# finding 3): with the web rule's port check gone from name_grant, NetSurf
# connects to two.web.test:8080, which SLIRP relays to the test server; the
# server logs `must-not-reach` and the recipe fails (and the refusal page's
# colour check with it).
[[mutant]]
id = "W-web-name-any-port-gui"
file = "crates/zoraya-abi/src/net.rs"
find = '''
            r.target.admits_public_answers(name)
                && r.ports.contains(port)'''
replace = '''
            r.target.admits_public_answers(name)'''
note = "a name only the web rule admits is reached on any port: the relayed two.web.test:8080 is logged"
tests = ["make -s test-netsurf"]
timeout = 3000

# ADR-0328 (INV-0328-1): the public-only name rule of a URL under `net web`.
# Each mutant lets a URL's name answer into the local network, or widens the
# rule; checked by hand once each when written (all killed, 9g-url report).

[[mutant]]
id = "U-public-name-every-name"
file = "crates/zoraya-abi/src/net.rs"
find = 'Target::PublicName(n) => *n == name,'
replace = 'Target::PublicName(_) => true,'
note = "a public-only name rule admits every name, not its own"
tests = ["cargo test -q -p zoraya-abi --lib net", "cargo test -q -p zoraya-net --lib public_name"]

[[mutant]]
id = "U-public-name-names-the-name"
file = "crates/zoraya-abi/src/net.rs"
find = 'Target::Name(n) => *n == name,'
replace = 'Target::Name(n) | Target::PublicName(n) => *n == name,'
note = "the URL's name is named, so a private answer is used (the rebinding)"
tests = ["cargo test -q -p zoraya-abi --lib net", "cargo test -q -p zoraya-net --lib public_name"]

[[mutant]]
id = "U-public-name-any-protocol"
file = "crates/zoraya-abi/src/net.rs"
find = 'if matches!(target, Target::Public | Target::PublicName(_)) && protocols != Protocols::TCP {'
replace = 'if target == Target::Public && protocols != Protocols::TCP {'
note = "the decoder takes a public-only name over UDP or echo"
tests = ["cargo test -q -p zoraya-abi --lib net"]

[[mutant]]
id = "U-anything-within-public-name"
file = "crates/zoraya-abi/src/net.rs"
find = '(_, Target::PublicName(_)) | (Target::PublicName(_), _) => false,'
replace = '(_, Target::PublicName(_)) => true, (Target::PublicName(_), _) => false,'
note = "narrow from a public-only name to a name, address or web rule"
tests = ["cargo test -q -p zoraya-abi --lib net"]

[[mutant]]
id = "U-public-name-within-other-name"
file = "crates/zoraya-abi/src/net.rs"
find = '(Target::PublicName(n), Target::PublicName(p)) => n == p,'
replace = '(Target::PublicName(_), Target::PublicName(_)) => true,'
note = "narrow from one public-only name to another name"
tests = ["cargo test -q -p zoraya-abi --lib net"]

[[mutant]]
id = "U-shell-url-name-rule-kept"
file = "crates/zoraya-shell/src/netgrant.rs"
find = 'Named::Name(name) if web => {'
replace = 'Named::Name(name) if false => {'
note = "Option A again: the URL's name rule beside the web rule (9f-net review, finding 2)"
tests = ["cargo test -q -p zoraya-shell --lib netgrant"]

[[mutant]]
id = "U-shell-public-name-is-a-name"
file = "crates/zoraya-shell/src/netgrant.rs"
find = 'target: Named::PublicName(name),'
replace = 'target: Named::Name(name),'
note = "on another port the URL's name takes every answer"
tests = ["cargo test -q -p zoraya-shell --lib netgrant"]

[[mutant]]
id = "U-shell-rule-on-web-ports"
file = "crates/zoraya-shell/src/netgrant.rs"
find = 'if !web_port(url.port) {'
replace = 'if true {'
note = "a rule of its own on 80 and 443 (a second pill, a second grants line)"
tests = ["cargo test -q -p zoraya-shell --lib netgrant"]

[[mutant]]
id = "U-shell-no-rule-on-other-port"
file = "crates/zoraya-shell/src/netgrant.rs"
find = 'if !web_port(url.port) {'
replace = 'if false {'
note = "Option C: no rule on another port, so the URL is refused"
tests = ["cargo test -q -p zoraya-shell --lib netgrant"]

[[mutant]]
id = "U-shell-public-name-pill"
file = "crates/zoraya-shell/src/netgrant.rs"
find = 'return Some(alloc::format!("+net {target} {PUBLIC_MARK}"));'
replace = 'return Some(alloc::format!("+net {target}"));'
note = "the pill reads as a +net word, which would take local answers"
tests = ["cargo test -q -p zoraya-shell --lib netgrant"]

# The 9g-url review, finding 1: one reply with a public and a private answer.

[[mutant]]
id = "U-conn-stop-at-refused-answer"
file = "crates/zoraya-net/src/conn.rs"
find = '''
                self.saw_local = true;
                continue;'''
replace = '''
                self.saw_local = true;
                break;'''
note = "a refused answer ends the candidates: the public answer after a private one is never tried"
tests = ["cargo test -q -p zoraya-net --lib mixed_answers"]

[[mutant]]
id = "U-conn-first-answer-only"
file = "crates/zoraya-net/src/conn.rs"
find = '!named && (!is_public(a) || is_local(stack, a, now_us))'
replace = 'self.next == 1 && !named && (!is_public(a) || is_local(stack, a, now_us))'
note = "only the first answer is checked: a private second answer is connected"
tests = ["cargo test -q -p zoraya-net --lib mixed_answers"]

[[mutant]]
id = "U-lookup-stop-at-refused-answer"
file = "crates/zoraya-net/src/service.rs"
find = '''
        .filter(|a| {
            let local = is_local(stack, **a, now_us);'''
replace = '''
        .take_while(|a| {
            let local = is_local(stack, **a, now_us);'''
note = "the lookup's answer ends at the first refused address"
tests = ["cargo test -q -p zoraya-net --lib mixed_answers"]
