# Plan part F7b (INV-0440-1, INV-0440-2, INV-0441-1 to -4): TCP listeners and the loopback. The service's
# grant, bounds and loopback decision (`crates/zoraya-net/src/service_tests.rs`, `accounts_tests.rs`,
# `conn_tests.rs`), the library's calls over a fake `netd` (`crates/zoraya-posix/tests/tcplisten.rs`) and the
# shell's word (`crates/zoraya-shell` netgrant tests). Host tests only; the QEMU half is `make test-net-posix`.
# `make mutants` runs each against the committed tree.
#
# Not listed, equivalent (each tried and survived): the loopback's `a[0] != 127` bypass of the local-address check
# (`decide` already refuses 127.x unless a rule covers it, and `web` never does: defence in depth); `a[0] == 127` in
# `next_candidate` (the stack has no route to 127.x and `tcp_open` refuses it: defence in depth); `handles.len() == 2`
# in `accept` (`decode` is given the handle count and refuses any but 2); the ephemeral search's start (`next_port`: a rotating start, any covered free port is
# right); `self.next_peer`'s modulus (the made-up port only has to differ between nearby connections).
tests = ["cargo test -q -p zoraya-net", "cargo test -q -p zoraya-posix --test tcplisten --lib", "cargo test -q -p zoraya-shell netgrant"]
timeout = 900

[[mutant]]
id = "F7b-listen-without-right"
file = "crates/zoraya-net/src/connection.rs"
find = '''                self.rights & rights::LISTEN != 0
                    && port != 0
                    && self.scope().allows_listen(port, Protocols::TCP),'''
replace = '''                port != 0 && self.scope().allows_listen(port, Protocols::TCP),'''
note = "INV-0440-1: the right is needed beside the rule"

