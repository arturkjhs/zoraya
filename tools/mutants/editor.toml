# zoraya-editor: the buffer's edits, undo, find, and the text view's
# geometry and keys. Survivors of 7f's cargo-mutants run (TASK-24), each
# killed by a test added for it. Host tests only: seconds per mutant.
tests = ["cargo test -q -p zoraya-editor"]
timeout = 300

[[mutant]]
id = "E-empty"
file = "crates/zoraya-editor/src/lib.rs"
find = 'self.text.is_empty()'
replace = 'true'
note = "7f lib.rs:81:9: is_empty_tells_text_from_no_text"

[[mutant]]
id = "E-left-guard"
file = "crates/zoraya-editor/src/lib.rs"
find = 'Move::Left if !extend && a != b => a,'
replace = 'Move::Left if true => a,'
note = "7f lib.rs:143:27: a_left_without_a_selection_steps_back_one_character"

[[mutant]]
id = "E-left-or"
file = "crates/zoraya-editor/src/lib.rs"
find = 'Move::Left if !extend && a != b => a,'
replace = 'Move::Left if !extend || a != b => a,'
note = "7f lib.rs:143:35: a_left_without_a_selection_steps_back_one_character"

[[mutant]]
id = "E-remove-clamp"
file = "crates/zoraya-editor/src/lib.rs"
find = 'remove.min(self.text.len() - at)'
replace = 'remove.min(self.text.len() + at)'
note = "7f lib.rs:189:49: delete_at_the_end_does_nothing"

[[mutant]]
