[package]
name = "zoraya-test-runner"
description = "Runs the in-QEMU kernel tests through tools/run-qemu.sh and checks the ZORAYA-TEST protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Zoraya's own crates, to read the screen as the terminal draws it.
zoraya-font = { path = "../../crates/zoraya-font" }
zoraya-term = { path = "../../crates/zoraya-term" }
zoraya-compositor = { path = "../../crates/zoraya-compositor" }

[[bin]]
name = "zoraya-test-runner"
path = "src/main.rs"

[[bin]]
name = "zoraya-crash-test"
path = "src/crash.rs"

[lints]
workspace = true
