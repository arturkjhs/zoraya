[package]
name = "zoraya-test-httpd"
description = "A bounded HTTP/1.1 test server on 127.0.0.1 for make test-net: deterministic bodies of chosen size and framing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# TLS in front of the plain server for the HTTPS tests (ADR-0228, ADR-0230):
# std, host only; recorded in docs/dependencies.md.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
